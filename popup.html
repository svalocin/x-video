<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x-video</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img
            class="brand-icon"
            src="icons/icon48.png"
            alt="Rotate Video Logo"
            aria-hidden="true"
          />
          <div class="brand-info">
            <h1 class="brand-title">x-video</h1>
            <span class="brand-version">v1.1</span>
          </div>
        </div>
        <div
          class="status-badge"
          id="status-angle"
          data-i18n-title="statusAngleTitle"
          title="Current rotation angle"
        >
          0°
        </div>
      </header>

      <button type="button" class="action-card action-pip" id="btn-pip">
        <div class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect
              x="3"
              y="4"
              width="18"
              height="14"
              rx="2"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <rect
              x="12"
              y="11"
              width="7"
              height="5"
              rx="1"
              fill="currentColor"
            />
          </svg>
        </div>
        <div class="action-content">
          <span class="action-label" data-i18n="pipLabel"
            >Picture-in-Picture</span
          >
          <span class="action-desc" data-i18n="pipDesc"
            >Floating play · Alt+P</span
          >
        </div>
      </button>

      <section
        class="quick-grid"
        data-i18n-aria-label="quickActionsAria"
        aria-label="Quick actions"
      >
        <button type="button" class="action-card" id="btn-rotate-right">
          <div class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M20 12a8 8 0 1 1-2.34-5.66L20 8.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M20 4v4.5h-4.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="action-content">
            <span class="action-label" data-i18n="rotateRightLabel"
              >Clockwise</span
            >
            <span class="action-desc">+90°</span>
          </div>
        </button>

        <button type="button" class="action-card" id="btn-rotate-left">
          <div class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M4 12a8 8 0 1 0 2.34-5.66L4 8.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M4 4v4.5h4.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="action-content">
            <span class="action-label" data-i18n="rotateLeftLabel"
              >Counterclockwise</span
            >
            <span class="action-desc">-90°</span>
          </div>
        </button>

        <button type="button" class="action-card" id="btn-mirror">
          <div class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3v18"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-dasharray="2.5 2.5"
              />
              <path
                d="M8.5 8.5L5 12l3.5 3.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M15.5 8.5L19 12l-3.5 3.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="action-content">
            <span class="action-label" data-i18n="mirrorLabel">Mirror</span>
            <span class="action-desc" id="mirror-state" data-i18n="mirrorOff"
              >Flip horizontal</span
            >
          </div>
        </button>

        <button type="button" class="action-card action-reset" id="btn-reset">
          <div class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M6.8 6.8a7.5 7.5 0 1 1-1.6 7.2"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M3.5 4.5v4.2H7.7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="action-content">
            <span class="action-label" data-i18n="resetLabel">Reset</span>
            <span class="action-desc" data-i18n="resetDesc"
              >Restore defaults</span
            >
          </div>
        </button>
      </section>

      <details class="more" id="more-panel">
        <summary class="more-toggle">
          <span class="more-title" data-i18n="moreTitle">Advanced</span>
          <span class="more-caret" aria-hidden="true"></span>
        </summary>

        <div class="more-body">
          <section class="section">
            <div class="section-head">
              <h2 data-i18n="rotateSection">Rotation</h2>
              <div class="chip-row">
                <button type="button" class="chip" data-rotate-to="0">
                  0°
                </button>
                <button type="button" class="chip" data-rotate-to="90">
                  90°
                </button>
                <button type="button" class="chip" data-rotate-to="180">
                  180°
                </button>
                <button type="button" class="chip" data-rotate-to="270">
                  270°
                </button>
              </div>
            </div>
            <label class="control">
              <span class="label" data-i18n="angleLabel">Angle</span>
              <input
                id="rotate-range"
                type="range"
                min="0"
                max="360"
                step="1"
                value="0"
              />
              <input
                id="rotate-number"
                class="value"
                type="number"
                min="0"
                max="360"
                step="1"
                value="0"
              />
            </label>
          </section>

          <section class="section">
            <div class="section-head">
              <h2 data-i18n="positionSection">Position</h2>
            </div>
            <label class="control">
              <span class="label" data-i18n="verticalLabel">Vertical</span>
              <input
                id="top-range"
                type="range"
                min="-600"
                max="600"
                step="1"
                value="0"
              />
              <input
                id="top-number"
                class="value"
                type="number"
                min="-600"
                max="600"
                step="1"
                value="0"
              />
            </label>
            <label class="control">
              <span class="label" data-i18n="horizontalLabel">Horizontal</span>
              <input
                id="left-range"
                type="range"
                min="-600"
                max="600"
                step="1"
                value="0"
              />
              <input
                id="left-number"
                class="value"
                type="number"
                min="-600"
                max="600"
                step="1"
                value="0"
              />
            </label>
          </section>

          <section class="section">
            <div class="section-head">
              <h2 data-i18n="scaleSection">Scale</h2>
            </div>
            <label class="control">
              <span class="label" data-i18n="overallLabel">Overall</span>
              <input
                id="scale-range"
                type="range"
                min="1"
                max="400"
                step="1"
                value="100"
              />
              <input
                id="scale-number"
                class="value"
                type="number"
                min="1"
                max="400"
                step="1"
                value="100"
              />
            </label>
            <label class="control">
              <span class="label" data-i18n="horizontalLabel">Horizontal</span>
              <input
                id="scaleX-range"
                type="range"
                min="-400"
                max="400"
                step="1"
                value="100"
              />
              <input
                id="scaleX-number"
                class="value"
                type="number"
                min="-400"
                max="400"
                step="1"
                value="100"
              />
            </label>
            <label class="control">
              <span class="label" data-i18n="verticalLabel">Vertical</span>
              <input
                id="scaleY-range"
                type="range"
                min="-400"
                max="400"
                step="1"
                value="100"
              />
              <input
                id="scaleY-number"
                class="value"
                type="number"
                min="-400"
                max="400"
                step="1"
                value="100"
              />
            </label>
          </section>

          <footer class="shortcuts-hint">
            <span class="hint-label" data-i18n="shortcutsLabel">Shortcuts</span>
            <div class="hint-keys">
              <span
                ><kbd>Ctrl/⌘</kbd>+<kbd>Shift</kbd>+<kbd>1/2/3</kbd> ·
                <kbd>Alt</kbd>+<kbd>P</kbd></span
              >
            </div>
          </footer>
        </div>
      </details>

      <div id="no-video" class="overlay hidden" role="status">
        <div class="overlay-card">
          <div class="overlay-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M12 8v4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="12" cy="16" r="1" fill="currentColor" />
            </svg>
          </div>
          <h2 data-i18n="noVideoTitle">No video detected</h2>
          <p data-i18n="noVideoDesc">
            Make sure this page has an HTML5 player, then try again.
          </p>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
